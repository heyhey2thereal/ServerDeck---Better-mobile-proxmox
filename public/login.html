<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f3b47">
  <title>ServerDeck — connexion</title>
  <link rel="stylesheet" href="/style.css?v=1.0.0-3">
  <style>
    body { background: #e9e9e9; }
    .login-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background:
        linear-gradient(180deg, #f4f4f4 0, #e6e6e6 100%);
    }
    .login-box {
      width: 100%;
      max-width: 360px;
      background: #fff;
      border: 1px solid #c9c9c9;
      border-top: 3px solid var(--orange);
      box-shadow: 0 6px 20px rgba(0, 0, 0, .08);
      padding: 0 22px 22px;
    }
    .login-head {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px 0 14px;
      border-bottom: 1px solid var(--line-soft);
      margin-bottom: 16px;
    }
    .login-head .logo { width: 26px; height: 26px; }
    .login-head .logo::after { top: 9px; }
    .login-head h1 { font-size: 16px; margin: 0; font-weight: 700; letter-spacing: .2px; }
    .login-head .sub { font-size: 11px; color: var(--muted); margin-top: 1px; }
    label { display: block; font-size: 12px; color: #444; margin: 12px 0 4px; font-weight: 600; }
    input[type=text], input[type=password] {
      width: 100%;
      background: #fff;
      border: 1px solid #bfbfbf;
      border-radius: var(--radius);
      color: var(--text);
      padding: 9px 10px;
      font: inherit;
      font-size: 15px;
    }
    input:focus { outline: 2px solid rgba(229, 112, 0, .35); border-color: var(--orange); }
    .hintline { font-size: 11px; color: var(--muted); margin-top: 5px; }
    button.primary { margin-top: 18px; padding: 10px; font-size: 13px; }
    .err {
      margin-top: 14px;
      color: #a51f1f;
      font-size: 12px;
      background: #fdeeee;
      border: 1px solid #f0c2c2;
      border-left: 3px solid var(--red);
      padding: 8px 10px;
    }
    .login-switch { margin-top: 14px; text-align: center; font-size: 11px; }
    .login-switch a { color: var(--blue); text-decoration: none; }
    .foot { margin-top: 16px; text-align: center; font-size: 10px; color: #9a9a9a; }
  </style>
</head>
<body>
  <div class="login-wrap">
    <form class="login-box" method="post" action="/login" id="form" autocomplete="on">
      <div class="login-head">
        <span class="logo" aria-hidden="true"></span>
        <div>
          <h1>ServerDeck</h1>
          <div class="sub" id="subtitle">Console du serveur</div>
        </div>
      </div>

      <input type="hidden" name="mode" id="mode" value="">
      <input type="hidden" name="tfa" id="tfa" value="">

      <div id="userBlock">
        <label for="username">Nom d'utilisateur</label>
        <input id="username" name="username" type="text" autocapitalize="none" autocorrect="off"
               spellcheck="false" placeholder="root@pam">
        <div class="hintline" id="userHint">Identifiants Proxmox (realm inclus, ex. <code>root@pam</code>)</div>
      </div>

      <label for="password">Mot de passe</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>

      <div id="tfaBlock" class="hidden">
        <label for="code">Code de double authentification</label>
        <div class="hintline hidden" id="codeHint">Code à 6 chiffres de ton application TOTP
          (secret affiché à l'installation).</div>
        <input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code"
               maxlength="8" placeholder="123456">
      </div>

      <div id="err" class="err hidden">Identifiants refusés.</div>

      <button class="primary" type="submit" id="submit">Connexion</button>

      <div class="login-switch">
        <a href="#" id="toggle">Connexion avec le mot de passe local</a>
      </div>
      <div class="foot">ServerDeck</div>
    </form>
  </div>

  <script>
    (() => {
      const params = new URLSearchParams(location.search)
      const form = document.getElementById('form')
      const modeInput = document.getElementById('mode')
      const userBlock = document.getElementById('userBlock')
      const username = document.getElementById('username')
      const tfaBlock = document.getElementById('tfaBlock')
      const code = document.getElementById('code')
      const subtitle = document.getElementById('subtitle')
      const toggle = document.getElementById('toggle')
      let localMode = params.get('local') === '1'
      let localTotp = false

      const errParam = params.get('e')
      if (errParam) {
        const box = document.getElementById('err')
        if (errParam === 'net') {
          box.textContent = "Impossible de joindre l'API Proxmox (hôte, port 8006 ou certificat). Vérifie la configuration du serveur."
        }
        box.classList.remove('hidden')
      }

      const nonce = params.get('tfa')
      if (nonce) {
        document.getElementById('tfa').value = nonce
        tfaBlock.classList.remove('hidden')
        userBlock.classList.add('hidden')
        subtitle.textContent = 'Code de double authentification'
        document.getElementById('submit').textContent = 'Valider le code'
      }

      fetch('/api/auth-mode').then((r) => r.json()).then((info) => {
        if (info.mode !== 'proxmox') {
          localMode = true
        } else {
          subtitle.textContent = info.host ? `Proxmox · ${info.host}` : 'Proxmox'
        }
        localTotp = Boolean(info.totp)
        applyMode()
        if (!nonce) {
          const saved = localStorage.getItem('sd.user')
          username.value = saved || (info.mode === 'proxmox' ? 'root@pam' : '')
        }
      }).catch(applyMode)

      function applyMode() {
        modeInput.value = localMode ? 'local' : 'proxmox'
        userBlock.classList.toggle('hidden', localMode)
        const showCode = Boolean(nonce) || (localMode && localTotp)
        tfaBlock.classList.toggle('hidden', !showCode)
        code.required = Boolean(nonce) || (localMode && localTotp)
        toggle.textContent = localMode
          ? 'Connexion avec les identifiants Proxmox'
          : 'Connexion avec le mot de passe local'
        document.getElementById('codeHint').classList.toggle('hidden', !(localMode && localTotp))
        if (!nonce) {
          setTimeout(() => (localMode ? document.getElementById('password') : username).focus(), 50)
        }
      }

      toggle.onclick = (event) => {
        event.preventDefault()
        localMode = !localMode
        applyMode()
      }

      form.addEventListener('submit', () => {
        if (!localMode && username.value.trim()) localStorage.setItem('sd.user', username.value.trim())
        if (nonce) code.required = true
      })
    })()
  </script>
</body>
</html>
