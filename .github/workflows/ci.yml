name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Dépendances système
        run: sudo apt-get update && sudo apt-get install -y build-essential python3 tmux

      - run: npm ci

      - name: Vérifier node-pty
        run: node -e "require('node-pty')" || npm rebuild node-pty

      - name: Tests
        run: npm test
