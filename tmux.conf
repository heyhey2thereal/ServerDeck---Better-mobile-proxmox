# Config du serveur tmux dédié à ServerDeck (socket « serverdeck »).
set -g status off
set -g aggressive-resize on
set -g history-limit 10000
set -g mouse on
set -g escape-time 0
set -g focus-events on
set -g default-terminal "tmux-256color"
set -g visual-activity off
set -g visual-bell off
set -g monitor-bell off
set -g set-titles off
set -g renumber-windows on
# OSC 52 : le copier de tmux va jusqu'au presse-papier du téléphone
set -g set-clipboard on
set -g allow-passthrough on
set -ga terminal-features 'xterm*:clipboard'
set -ga terminal-features 'screen*:clipboard'
set -ga terminal-features 'tmux*:clipboard'
